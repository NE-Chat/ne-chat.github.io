<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#292929">
<meta name="description" content="NE의 캐릭터 도감.">
<title>NE · 도감</title>
<link rel="icon" href="emblem.svg" type="image/svg+xml">
<link rel="preload" href="cover.webp" as="image">
<link rel="preload" href="wood.webp" as="image">
<link rel="preload" href="open-book.webp" as="image">
<link rel="preload" href="smoke.webp" as="image">
<link rel="preload" href="paper.webp" as="image">
<link rel="preload" href="reader-book.webp" as="image">
<link rel="stylesheet" href="style.css?v=ne-codex-7">
<script type="module" src="app.js?v=ne-codex-7"></script>
</head>
<body>
<section id="entrance" aria-label="도감 입장">
 <div class="desk" aria-hidden="true"></div>
 <button id="skip" class="skip" aria-label="연출을 건너뛰고 도감 입장">건너뛰기 <span aria-hidden="true">↗</span></button>
 <div class="scene" id="scene">
  <div class="desk-glow" aria-hidden="true"></div>
  <div class="intro-stage" id="spread">
   <div class="book-contact-shadow" aria-hidden="true"></div>
   <button id="open-book" class="physical-book" aria-label="책 펼치기">
    <span class="intro-right" aria-hidden="true"></span>
    <span class="intro-left" aria-hidden="true">
     <span class="intro-inside"></span>
     <span class="intro-outside"></span>
    </span>
   </button>
  </div>
  <canvas id="magic" aria-hidden="true"></canvas>
 </div>
 <div id="entry-book" aria-hidden="true" hidden></div>
 <div class="entry-controls"><button id="open-action" class="entry-button">펼치기 <span aria-hidden="true">◇</span></button></div>
</section>
<main id="archive" hidden aria-label="NE 도감">
 <div class="reader-desk" aria-hidden="true"></div>
 <header class="reader-top">
  <button id="home" class="ne-home" aria-label="NE 도감 첫 장">NE</button>
  <nav id="categories" class="category-tabs" aria-label="도감 카테고리"></nav>
  <button id="replay" class="icon-button replay" aria-label="책 닫기" title="책 닫기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4H5a2 2 0 0 0-2 2v14h14a3 3 0 0 0-3-3H3M8 4v13m0-13h10v13"/></svg></button>
 </header>
 <div id="reader" class="reader" tabindex="-1">
  <div class="binding" aria-hidden="true"></div>
  <div class="page-stack" aria-hidden="true"></div>
  <div id="pages" class="pages"></div>
  <div class="gutter" aria-hidden="true"></div>
 </div>
</main>
<dialog id="character-dialog" aria-labelledby="character-name">
 <button id="close-character" class="dialog-close" aria-label="캐릭터 닫기">×</button>
 <div class="character-detail"><div class="detail-art"><img id="character-image" alt=""></div><div class="detail-copy"><p id="character-category"></p><h2 id="character-name"></h2><div class="ink-rule" aria-hidden="true"></div><p id="character-description"></p><a id="character-link" target="_blank" rel="noopener noreferrer" hidden>↗</a></div></div>
</dialog>
<p id="status" role="status" class="sr-only"></p>
<noscript><div class="no-script">NE · 도감 — JavaScript를 켜주세요.</div></noscript>
</body></html>
